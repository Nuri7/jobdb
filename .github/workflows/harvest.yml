name: harvest-companies

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC — discover newly-onboarded ATS boards, then log metrics
  workflow_dispatch:
    inputs:
      ats:
        description: 'Comma-separated ATS platforms'
        required: false
        default: 'recruitee,homerun,personio,greenhouse,ashby'
      limit:
        description: 'Max new boards to validate per platform'
        required: false
      min_nl:
        description: 'Min NL jobs to keep a board'
        required: false
        default: '1'
      dry_run:
        description: 'Validate only, insert nothing'
        type: boolean
        default: false

concurrency:
  group: jobdb-pipeline # shared with refresh.yml / resolve.yml — runs never overlap
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    # 9 platforms now instead of 5, and keep-rates are ~1% so nearly every discovered token is
    # re-validated each week (rejects aren't recorded). The 5-platform run already took ~50 min;
    # lever+workable+smartrecruiters add ~4k validations on top. A platform only writes its
    # keepers after validating all of them, so a timeout mid-platform throws that whole platform
    # away — hence the generous ceiling rather than a tight one.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      # Discover + validate + insert new NL-hiring boards. Dedup skips boards already stored,
      # so after the initial backfill each weekly run only handles genuinely new companies.
      # No --ats here on purpose: the CLI defaults to every harvestable platform, so adding a
      # discoverer takes effect without editing this file (a hardcoded list silently skipped
      # lever/workable/smartrecruiters once already).
      - name: Harvest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          npx tsx src/cli.ts harvest
          ${{ inputs.ats && format('--ats "{0}"', inputs.ats) || '' }}
          --min-nl "${{ inputs.min_nl || '1' }}"
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # Record the weekly metrics row (companies/jobs added + removed) — runs even if harvest fails.
      - name: Snapshot metrics
        if: ${{ always() && inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/cli.ts snapshot | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --search "in:title 🔴 Pipeline failing" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "\`${{ github.workflow }}\` failed — $RUN_URL"
          else
            gh issue create --title "🔴 Pipeline failing" --body "\`${{ github.workflow }}\` failed — $RUN_URL" || true
          fi
